<!doctype html>
<html lang="en" class = "sign-in-up">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="icon" type="png" href="images/pixels_icon.svg" />
    <link rel="stylesheet" class = "theme" href="css/global.css" />
    <link rel="stylesheet" href="css/signup.css" />

    <title>Pixels | Sign Up</title>
  </head>
  <body>
    <header>
            <nav class="nav-bar">
                <button class="nav-toggle">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </button>
                <div class="nav-logo">
                    <a href="" class="logo">
                        <i class="fa-solid fa-ghost"></i>
                        <p>Pixels</p>
                    </a>
                </div>
                <div class = "lightnav-toggle">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
                <ul class="nav-menu">
                    <li>
                        <a href="index.html" class = "active">
                            <i class="fa-solid fa-gamepad"></i>
                            <p>Store</p>
                        </a>
                    </li>
                    <li>
                        <a href="browse.html">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <p>Browse</p>
                        </a>
                    </li>
                    <li class = "session-dependentLink">
                        <a href="support.html">
                            <i class="fa-solid fa-headset"></i>
                            <p>Support</p>
                        </a>
                    </li>
                    <li>
                        <a href="news.html">
                            <i class="fa-solid fa-newspaper"></i>
                            <P>News</P>
                        </a>
                    </li>
                    <div id = "theme-container">
                        <input type="checkbox" id = "theme-btn">
                        <label for="theme-btn" class = "theme-toggle">
                            <i class="bi bi-sun-fill"></i>
                            <i class="fa-solid fa-moon"></i>
                        </label>
                    </div>
                </ul>
                <div id = "signin-userContainer">
                    <a href="signin.html" class="sign-in">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <p>Sign in</p>
                    </a>
                </div>
            </nav>
        </header>
    <main>
      <div class="container" id="container">
        <form id="form">
          <div class="form-head">
            <h1><i class="fa-solid fa-ghost"></i> Pixels</h1>
            <h3>Create an account</h3>
          </div>
          <div class="input-box">
            <input type="text" placeholder="Email Address" name="email" />
            <!-- <i class="fa-solid fa-envelope" id="email"></i> -->
          </div>
          <div class="input-box">
            <input type="text" placeholder="Username" name="user" />
            <!-- <i class="fa-solid fa-user" id="user"></i> -->
          </div>
          <div class="input-box">
            <input type="password" placeholder="Password" name="pass" />
            <!-- <i class="fa-solid fa-key" id="key"></i> -->
          </div>
          <div class="input-box">
            <input
              type="password"
              placeholder="Confirm Password"
              name="Cpass"
            />
            <!-- <i class="fa-solid fa-lock" id="lock"></i> -->
          </div>
          <div class="pass-checker">
            <p>
              <i class="fa-solid fa-star"></i> Password should be greater than
              4 and less than 20
            </p>
          </div>
          <input type="submit" class="login-btn" value="Sign Up" />
          <div class="have-acc">
            <p>Already have an account?</p>
            <a href="signin.html">Sign in</a>
          </div>
        </form>
      </div>
    </main>

    <script src="js/global.js"></script>
    <script src="js/signup.js"></script>
  </body>
</html>
