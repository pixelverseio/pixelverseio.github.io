<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixels | Sign Up</title>
    <link rel="icon" type="png" href="images/pixels_icon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" class="theme dark-theme" href="css/global.css" />
    <link rel="stylesheet" href="css/signup.css" />
  </head>
  <body>
    <div class="screen">
      <header style="display: none;">
        <nav class="nav-bar">
          <button class="nav-toggle">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </button>
          <div class="nav-logo">
            <a href="" class="logo">
              <i class="fa-solid fa-ghost"></i>
              <p>Pixels</p>
            </a>
          </div>
          <div class="lightnav-toggle">
            <i class="fa-solid fa-chevron-right"></i>
          </div>
          <ul class="nav-menu">
            <li>
              <a href="index.html" class="active">
                <i class="fa-solid fa-gamepad"></i>
                <p>Store</p>
              </a>
            </li>
            <li>
              <a href="browse.html">
                <i class="fa-solid fa-magnifying-glass"></i>
                <p>Browse</p>
              </a>
            </li>
            <li class="session-dependentLink">
              <a href="support.html">
                <i class="fa-solid fa-headset"></i>
                <p>Support</p>
              </a>
            </li>
            <li>
              <a href="news.html">
                <i class="fa-solid fa-newspaper"></i>
                <p>News</p>
              </a>
            </li>
            <div id="theme-container">
              <input type="checkbox" id="theme-btn" />
              <label for="theme-btn" class="theme-toggle">
                <i class="bi bi-sun-fill"></i>
                <i class="fa-solid fa-moon"></i>
              </label>
            </div>
          </ul>
          <div id="signin-userContainer">
            <a href="signin.html" class="sign-in">
              <i class="fa-solid fa-right-to-bracket"></i>
              <p>Sign in</p>
            </a>
          </div>
        </nav>
      </header>
      <main class="main-content">
        <div class="container" id="container">
          <form id="form">
            <div class="form-head">
              <h1><i class="fa-solid fa-ghost"></i> Pixels</h1>
              <h3>Create an account</h3>
            </div>
            <div class="input-box">
              <input type="text" placeholder="Email Address" name="email" />
              <!-- <i class="fa-solid fa-envelope" id="email"></i> -->
            </div>
            <div class="input-box">
              <input type="text" placeholder="Username" name="user" />
              <!-- <i class="fa-solid fa-user" id="user"></i> -->
            </div>
            <div class="input-box">
              <input type="password" placeholder="Password" name="pass" />
              <!-- <i class="fa-solid fa-key" id="key"></i> -->
            </div>
            <div class="input-box">
              <input
                type="password"
                placeholder="Confirm Password"
                name="Cpass"
              />
              <!-- <i class="fa-solid fa-lock" id="lock"></i> -->
            </div>
            <div class="pass-checker">
              <p>
                <i class="fa-solid fa-star"></i> Password should be greater than
                4 and less than 20
              </p>
            </div>
            <input type="submit" class="login-btn" value="Sign Up" />
            <div class="have-acc">
              <p>Already have an account?</p>
              <a href="signin.html">Sign in</a>
            </div>
          </form>
        </div>
      </main>
    </div>
    <footer style="display: none;">
      <a class="logo" href="index.html"> Pixels </a>
      <p>&copy; 2026 Pixels | All rights reserved</p>
    </footer>
    <script src="js/global.js"></script>
    <script src="js/signup.js"></script>
  </body>
</html>
